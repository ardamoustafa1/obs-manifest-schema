name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build -trimpath -o ./bin/obsctl ./cmd/obsctl
      - name: CLI smoke test
        run: ./bin/obsctl validate testdata/valid/http.yaml testdata/valid/worker.yaml testdata/valid/batch.yaml testdata/valid/database.yaml

